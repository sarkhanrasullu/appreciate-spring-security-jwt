<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="index.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4">Students</h1>

    <!-- Filter -->
    <div class="card mb-4 alma">
        <div class="card-header">Filter</div>
        <div class="card-body">
            <div class="row g-2">
                <div class="col-sm-4">
                    <input type="text" id="filterName" class="form-control" placeholder="Name"/>
                </div>
                <div class="col-sm-4">
                    <input type="text" id="filterSurname" class="form-control" placeholder="Surname"/>
                </div>
                <div class="col-sm-2">
                    <input type="number" id="filterAge" class="form-control" placeholder="Age"/>
                </div>
                <div class="col-sm-2">
                    <button class="btn btn-primary w-100" onclick="loadStudents()">Search</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Student -->
    <div class="card mb-4 alma">
        <div class="card-header">Add Student</div>
        <div class="card-body">
            <div class="row g-2">
                <div class="col-sm-2">
                    <input type="text" id="name" class="form-control" placeholder="Name"/>
                </div>
                <div class="col-sm-2">
                    <input type="text" id="surname" class="form-control" placeholder="Surname"/>
                </div>
                <div class="col-sm-3">
                    <input type="text" id="email" class="form-control" placeholder="Email"/>
                </div>
                <div class="col-sm-1">
                    <input type="number" id="age" class="form-control" placeholder="Age"/>
                </div>
                <div class="col-sm-2">
                    <input type="number" id="scholarship" class="form-control" placeholder="Scholarship"/>
                </div>
                <div class="col-sm-1">
                    <input type="number" id="universityId" class="form-control" placeholder="Uni ID"/>
                </div>
                <div class="col-sm-1">
                    <button class="btn btn-success w-100" onclick="insertStudent()">Insert</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Student (Modal) -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId"/>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" id="editName" class="form-control"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Surname</label>
                        <input type="text" id="editSurname" class="form-control"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="text" id="editEmail" class="form-control"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        <input type="number" id="editAge" class="form-control"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Scholarship</label>
                        <input type="number" id="editScholarship" class="form-control"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">University ID</label>
                        <input type="number" id="editUniversityId" class="form-control"/>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="updateStudent()">Update</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Surname</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Scholarship</th>
                        <th>University</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="studentsBody">

                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="index.js"></script>
</body>
</html>
